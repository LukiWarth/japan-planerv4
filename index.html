<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Japan Reiseplaner</title>
<meta name="theme-color" content="#d9472b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{color-scheme:light dark;--bg:#faf6f0;--card:#fff;--ink:#23284a;--mut:#6b6f8a;--line:#e8e1d6;--acc:#d9472b;--soft:#f3ece2;--blue:#1e6fd9;--ok:#2f9e6b;--warn:#d99a1d;--bad:#c43d52;--sh:0 4px 18px #2b3a6722;--r:16px}
@media(prefers-color-scheme:dark){:root{--bg:#14172b;--card:#1e2243;--ink:#eceefb;--mut:#9aa0c4;--line:#2d3358;--acc:#ff6a4d;--soft:#272c52;--blue:#6aa8ff;--sh:0 4px 18px #0007}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
.mut{color:var(--mut)}.sm{font-size:.82rem}
/* Kopfzeile */
#top{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--card);border-bottom:1px solid var(--line);z-index:30}
#brand{font-weight:800;font-size:1.05rem;white-space:nowrap}
#brand i{font-style:normal;color:var(--acc)}
#vs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;padding:4px 0}
#vs::-webkit-scrollbar{display:none}
.vc{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;white-space:nowrap;font-size:.85rem;font-weight:600}
.vc.on{background:var(--acc);border-color:var(--acc);color:#fff}
/* Aufbau */
#app{position:absolute;top:54px;bottom:0;left:0;right:0;display:grid;grid-template-columns:440px 1fr}
#panel{grid-column:1;grid-row:1;position:relative;z-index:50;display:flex;flex-direction:column;background:var(--bg);border-right:1px solid var(--line);min-height:0;z-index:20}
#mapwrap{grid-column:2;grid-row:1;position:relative;min-width:0;z-index:0;isolation:isolate}
#lmap{position:absolute;inset:0;background:#cfe3ee}
#handle{display:none}
#pbody{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
#bn{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
#bn button{flex:1;border:0;background:none;padding:8px 1px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.66rem;font-weight:600;color:var(--mut)}
#bn button b{font-size:1.25rem;line-height:1}
#bn button.on{color:var(--acc)}
@media(max-width:820px){
 #app{display:block}
 #mapwrap{position:absolute;inset:0;z-index:0}
 #panel{position:absolute;left:0;right:0;bottom:0;height:46%;border-right:0;border-radius:20px 20px 0 0;box-shadow:0 -6px 24px #0003;transition:height .25s ease}
 #panel.drag{transition:none}
 #handle{display:block;padding:9px 0 5px;touch-action:none;cursor:grab}
 #handle i{display:block;width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
 #brand span{display:none}
}
/* Karte */
#mc{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:500}
#mc button{width:40px;height:40px;border-radius:12px;border:0;background:var(--card);box-shadow:var(--sh);font-size:1.1rem;display:grid;place-items:center}
#mc button.on{background:var(--acc);color:#fff}
#zbar{position:absolute;left:10px;right:60px;top:10px;z-index:500;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}#zbar::-webkit-scrollbar{display:none}#zbar button{flex:none;border:2px solid #fff;color:#fff;font-weight:700;font-size:.78rem;padding:6px 11px;border-radius:99px;box-shadow:var(--sh);text-shadow:0 1px 2px #0005;white-space:nowrap}#zbar button.on{outline:3px solid #23284a;outline-offset:1px}
#rstat{position:absolute;left:10px;top:52px;z-index:500;max-width:calc(100% - 70px);background:var(--card);box-shadow:var(--sh);border-radius:10px;padding:5px 10px;font-size:.76rem;color:var(--mut)}
#rstat:empty{display:none}
.mkw{background:none;border:0}
.mk{position:relative;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 2px 8px #0006;font-size:18px;transition:transform .15s}
.mk.act{transform:scale(1.3);box-shadow:0 0 0 4px #fff8,0 3px 12px #0008}
.mk b{position:absolute;top:-9px;right:-9px;min-width:19px;height:19px;padding:0 4px;border-radius:99px;background:#23284a;color:#fff;font-size:11px;display:grid;place-items:center;border:2px solid #fff}
.mkl{position:absolute;top:40px;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 12px system-ui;color:#23284a;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 5px #fff;pointer-events:none}
.pp{width:28px;height:28px;border-radius:50%;background:#fff;border:2.5px solid var(--c,#1c8fb5);display:grid;place-items:center;font-size:14px;box-shadow:0 2px 6px #0005;position:relative}
.vm{position:absolute;top:5px;min-width:17px;padding:0 4px;box-sizing:border-box;height:17px;border-radius:9px;white-space:nowrap;color:#fff;font-size:10px;font-weight:800;line-height:17px;text-align:center;border:1.5px solid #fff;box-shadow:0 1px 3px #0006}.vm.vc{right:calc(100% - 2px);background:#d6336c}.vm.vl{left:calc(100% - 2px);background:#1c7ed6}
.pp{width:38px;height:38px;border-width:4px;font-size:21px;box-shadow:0 0 0 3px #fff,0 4px 10px #0008}.pp.hb{box-shadow:0 0 0 3px #fff,0 0 0 7px #1e6fd966,0 4px 10px #0008}
.vm{top:10px}
.pp.lo .vm{display:none}.pp.lo .vm.vrt{display:inline}
.vm.vrt{background:#fff8d6;color:#5a4300}
.pp.nw{background:#e0312f;border-color:#a01f1c}
.pp.dn{opacity:.5;filter:grayscale(.8)}
.pp.hb{border-color:var(--blue);box-shadow:0 0 0 3px #1e6fd955,0 2px 6px #0005}
.rl{display:inline-block;transform:translate(-50%,-50%);white-space:nowrap;font:700 11.5px system-ui;background:#fffe;color:#23284a;border-radius:99px;padding:2px 8px;box-shadow:0 1px 5px #0004;pointer-events:none}
.rl.hl{color:#1e6fd9}
.tip{max-width:230px}
.tip img{width:68px;height:68px;object-fit:cover;border-radius:8px;margin:2px}
.pop{font:13px/1.4 system-ui;min-width:170px}
.pop b{font-size:14px}
.pop a{color:#d9472b;font-weight:600}
/* Bausteine */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;margin-bottom:12px}
h2{font-size:1.1rem;margin:2px 0 10px}
h3{font-size:.95rem;margin:14px 0 6px;display:flex;align-items:center;gap:6px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-weight:600;font-size:.88rem;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm2{padding:5px 9px;font-size:.8rem;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:8px 10px}
textarea{min-height:88px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:4px 11px;font-size:.82rem}
.chip.on{background:var(--soft);border-color:var(--acc);font-weight:700}
.chip.add{border-style:dashed}
.badge{display:inline-flex;align-items:center;gap:3px;border-radius:99px;padding:2px 9px;font-size:.76rem;font-weight:700;background:var(--soft)}
.badge.ok{background:#2f9e6b22;color:var(--ok)}.badge.part{background:#d99a1d22;color:var(--warn)}.badge.early,.badge.late{background:#c43d5222;color:var(--bad)}
/* Kennzahlen */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--sh)}
.kpi .i{font-size:1.4rem}.kpi b{display:block;font-size:1.2rem;line-height:1.2}.kpi span{font-size:.76rem;color:var(--mut)}
/* Band */
.ribbon{display:flex;gap:3px;margin:0 0 14px;height:62px}
.ribbon div{border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:.78rem;min-width:30px;overflow:hidden;cursor:pointer;text-shadow:0 1px 3px #0006}
.ribbon div i{font-style:normal;font-size:1.25rem;line-height:1.1}
/* Zielkarten */
.sc{display:flex;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;cursor:pointer;border:2px solid transparent}
.sc.act{border-color:var(--acc)}
.sc .hero{width:84px;flex:none;display:grid;place-items:center;font-size:2rem;position:relative;background-size:cover;background-position:center}
.sc .hero b{position:absolute;top:6px;left:6px;background:#23284acc;color:#fff;border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.78rem;padding:0 5px}
.sc .sb{padding:10px 12px;flex:1;min-width:0}
.sc .sb strong{display:block;font-size:1.02rem}
.sc .go{align-self:center;padding-right:10px;color:var(--mut);font-size:1.4rem}
.leg{margin:5px 0 5px 30px;padding-left:12px;border-left:3px dotted var(--acc);font-size:.8rem;color:var(--mut);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.leg a{font-weight:600}
/* Zieldetail */
.back{border:0;background:none;color:var(--acc);font-weight:700;padding:0 0 8px;font-size:.92rem}
.hh{border-radius:var(--r);min-height:132px;padding:12px 14px;color:#fff;position:relative;display:flex;flex-direction:column;justify-content:flex-end;background-size:cover;background-position:center;overflow:hidden;margin-bottom:10px}
.hh::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 30%,#000a)}
.hh>*{position:relative}
.hh .em{position:absolute;right:12px;top:6px;font-size:3.4rem;opacity:.95;filter:drop-shadow(0 2px 4px #0005)}
.hh input{background:none;border:0;color:#fff;font-size:1.45rem;font-weight:800;padding:0;width:100%;text-shadow:0 2px 6px #0008}
.hh input:focus{outline:1.5px dashed #fff8}
.hh .sub{font-size:.85rem;text-shadow:0 1px 4px #0008}
.step{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.step button{border:0;background:none;width:34px;height:34px;font-size:1.2rem}
.step span{min-width:68px;text-align:center;font-weight:700;font-size:.88rem}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:14px;margin:12px 0}
.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:7px 2px;font-size:.8rem;font-weight:700;color:var(--mut)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 5px #0002}
.bloom{border-radius:12px;padding:9px 12px;font-size:.88rem;margin-bottom:10px;background:var(--soft)}
.bloom.ok{background:#2f9e6b22}.bloom.part{background:#d99a1d22}.bloom.early,.bloom.late{background:#c43d5222}
.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.imgs div{position:relative;aspect-ratio:1;border-radius:10px;background-size:cover;background-position:center}
.imgs div b{position:absolute;top:3px;right:3px;background:#000a;color:#fff;border-radius:99px;width:22px;height:22px;display:grid;place-items:center;font-size:.8rem;cursor:pointer}
/* Orte */
.srch{display:flex;gap:6px;position:sticky;top:-14px;background:var(--bg);padding:6px 0;z-index:5}
.srch input{flex:1}
.hit{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.hit small{display:block;color:var(--mut)}
#plist{display:flow-root}.pc{position:relative;display:flow-root;isolation:isolate;overflow:hidden;background:var(--card);border-radius:14px;box-shadow:var(--sh);margin-bottom:8px;padding:8px 10px}
.pc.dn .pn{text-decoration:line-through;opacity:.6}
.pc .top{display:flex;align-items:center;gap:8px}
.pc .pic{font-size:1.4rem;width:34px;text-align:center;flex:none}
.pc .pn{border:0;background:none;font-weight:700;padding:3px 0;border-radius:6px}
.pc .ib{border:0;background:var(--soft);border-radius:10px;width:34px;height:34px;flex:none;font-size:1rem}
.pc .ib.on{background:var(--ok);color:#fff}
.pc .more{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:grid;gap:7px}
.pc.flash{animation:fl 2s}
@keyframes fl{0%,60%{background:#ffe9a8}100%{background:var(--card)}}
.pl{font-size:.82rem}
/* Kosten */
.it{display:grid;grid-template-columns:58px 1fr 84px 30px;gap:6px;margin-bottom:6px;align-items:center}
.it select{padding:8px 2px}
.x{border:0;background:none;color:var(--mut);font-size:1.3rem}
.bar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--soft)}
.legend{display:grid;gap:4px;margin-top:8px}
.legend div{display:flex;align-items:center;gap:8px;font-size:.88rem}
.legend i{width:12px;height:12px;border-radius:4px;flex:none}
.legend span{margin-left:auto;font-weight:700}
.donut{display:block;margin:0 auto;width:190px;height:190px}
.donut text{text-anchor:middle;fill:var(--ink)}
/* Blüte */
.tl{position:relative;margin:6px 0 4px}
.tlr{display:grid;grid-template-columns:92px 1fr;gap:6px;align-items:center;margin:5px 0;font-size:.8rem}
.tlr .t{position:relative;height:22px;background:var(--soft);border-radius:7px}
.tlr .t i{position:absolute;top:0;bottom:0;border-radius:7px;font-style:normal}
.tlr .t .b{background:#f6a5b8aa;border:1px solid #e0708f}
.tlr .t .v{background:#2b3a67;top:7px;bottom:7px;border-radius:5px}
.axis{display:grid;grid-template-columns:92px 1fr;font-size:.7rem;color:var(--mut)}
.axis div{position:relative;height:16px}.axis span{position:absolute;transform:translateX(-50%)}
#dayfl{position:absolute;left:50%;top:94px;transform:translateX(-50%);z-index:500;background:#8a3fc7;color:#fff;border-radius:99px;padding:6px 6px 6px 14px;font-size:.82rem;font-weight:700;box-shadow:var(--sh);display:none;align-items:center;gap:8px;max-width:calc(100% - 140px)}
#dayfl.on{display:flex}#dayfl button{border:0;background:#fff3;color:#fff;border-radius:99px;width:26px;height:26px;flex:none}
.cn{width:20px;height:20px;border-radius:50%;background:#8a3fc7;color:#fff;font:800 12px system-ui;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px #0006}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.mg .wd{font-size:.7rem;color:var(--mut);text-align:center}
.mc{aspect-ratio:1;border-radius:10px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:.82rem;color:#fff;position:relative;line-height:1.1;text-shadow:0 1px 2px #0005;padding:0}
.mc.off{color:var(--mut);background:none;font-weight:500;text-shadow:none}
.mc i{font-style:normal;font-size:.8rem}
.mc u{position:absolute;top:2px;right:3px;text-decoration:none;background:#23284a;color:#fff;border-radius:99px;font-size:.62rem;min-width:15px;height:15px;display:grid;place-items:center}
.day{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:10px;margin-bottom:10px}
.day.on{outline:2px solid #8a3fc7}.day.flash{animation:fl 2s}
.dhd{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.dz{min-height:46px;border:2px dashed var(--line);border-radius:12px;padding:6px;display:grid;gap:5px;align-content:start}
.dz.ov{border-color:#8a3fc7;background:#8a3fc71a}
.dc{background:var(--soft);border-radius:10px;padding:5px 8px}
.dc.lift{opacity:.4}.dc.ovc{box-shadow:0 -3px 0 #8a3fc7}
.dr{display:flex;align-items:center;gap:8px}
.dh{touch-action:none;cursor:grab;font-size:1.2rem;padding:4px 6px;color:var(--mut);user-select:none}
.dnn{background:#8a3fc7;color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:.72rem;font-weight:800;flex:none}
.dt{flex:1;min-width:0;cursor:pointer;font-weight:600;font-size:.9rem}
.ce{display:flex;gap:6px;margin-top:6px}.ce input,.ce select{flex:1;padding:5px 8px}
.dsum{margin-top:8px}
.ghost{position:fixed;z-index:5000;pointer-events:none;transform:translate(-50%,-120%);background:#8a3fc7;color:#fff;border-radius:12px;padding:6px 12px;font-weight:700;font-size:.85rem;box-shadow:0 6px 18px #0006;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast-x{}
.tlz{position:relative;margin-top:8px;border-radius:10px;background:var(--soft)}
.tlz.ov{outline:2px solid #8a3fc7}
.hl{position:absolute;left:0;right:0;border-top:1px solid var(--line);font-size:.68rem;color:var(--mut);pointer-events:none}
.hl span{position:absolute;left:5px;top:1px}
.tlb{position:absolute;left:46px;right:4px;top:0;bottom:0}
.tb{position:absolute;border-radius:9px;color:#fff;padding:3px 7px 14px;font-size:.76rem;font-weight:700;touch-action:none;cursor:grab;overflow:hidden;box-shadow:0 2px 7px #0004;line-height:1.25;user-select:none}
.tb small{display:block;font-weight:500;opacity:.92}
.tb.tight{outline:2.5px solid #ffd84d}
.tb.mvg{opacity:.85;z-index:5}
.tbh{position:absolute;left:0;right:0;bottom:0;height:16px;cursor:ns-resize;touch-action:none;background:linear-gradient(#0000,#0005)}
.tbh::after{content:"";position:absolute;left:50%;bottom:5px;width:26px;height:3px;border-radius:9px;background:#fffc;transform:translateX(-50%)}
.tr{position:absolute;left:74%;width:25%;white-space:nowrap;border-radius:8px;color:#fff;padding:2px 5px;font-size:.7rem;font-weight:700;overflow:hidden;background:repeating-linear-gradient(45deg,#4f6f8f,#4f6f8f 7px,#6b8bab 7px,#6b8bab 14px);box-shadow:0 1px 4px #0003;line-height:1.2;pointer-events:none}
.tr small{display:block;font-weight:500;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ce{flex-wrap:wrap}.ce label{display:flex;flex-direction:column;font-size:.7rem;color:var(--mut);flex:1;min-width:96px}
.tbx{position:absolute;top:2px;right:5px;cursor:pointer;font-size:1rem;line-height:1;padding:2px}
.pth{width:38px;height:38px;border-radius:10px;object-fit:cover;flex:none}
.ph{display:flex;gap:6px;overflow-x:auto;margin-top:6px;padding-bottom:2px}
.ph div{position:relative;flex:none}
.ph img{height:68px;width:auto;max-width:130px;border-radius:9px;object-fit:cover;cursor:zoom-in;display:block;background:var(--soft);min-width:60px}
.ph .tb{position:absolute;left:3px;top:3px;background:#000b;color:#fff;border-radius:99px;padding:1px 7px;font-size:.66rem;font-style:normal;font-weight:700}.ph .mv{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:2px;padding:2px;background:linear-gradient(transparent,#0008);border-radius:0 0 9px 9px}.ph .mv i{font-style:normal;color:#fff;font-size:.8rem;min-width:24px;height:24px;display:grid;place-items:center;background:#0007;border-radius:7px;cursor:pointer}.ph .mv i.off{background:none}
.ph b{position:absolute;top:2px;right:2px;background:#000a;color:#fff;border-radius:99px;width:20px;height:20px;display:grid;place-items:center;font-size:.8rem;cursor:pointer}
#lb{position:fixed;inset:0;background:#000d;z-index:6000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
#lb.on{display:flex}#lb img{max-width:96vw;max-height:80vh;border-radius:12px}#lb a{color:#fff;font-size:.85rem}
.hero2{background:linear-gradient(135deg,#d9472b,#f08a5d);color:#fff;border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}

const HIRO15=[{k:'hondori',ty:'M',n:'Hondori Shopping Street',jp:'本通商店街',kw:'Einkaufsstraße, Arkade, Bummeln, Cafés, Okonomimura',t:'Überdachte Fußgänger-Einkaufsarkade im Zentrum von Hiroshima, ca. 600 m lang. Sie beginnt in der Nähe des Friedensparks und führt nach Osten Richtung Okonomimura und Parco. Hier gibt es Mode, Boutiquen, Cafés, Restaurants, Spielhallen, Purikura und Anime-Läden, dazu eine Bäckerei-Meile mitten in der Straße. Gut bei Regen oder Hitze zum Bummeln und Essen. Die Arkade ist immer begehbar, die meisten Geschäfte haben ca. 10:00 bis 20:00 geöffnet, manche bis 22:00. Eintritt frei. Anreise mit der Straßenbahn Linie 1, 2 oder 6 bis Hondori, der Eingang liegt direkt davor. Pin ungefähr, bitte auf der Karte prüfen.',ok:0,nw:1,dur:90,free:1,tr:{bahn:15,fuss:5},lat:34.3950,lon:132.4590,info:{addr:'Hondori, Naka-ku, Hiroshima',web:'https://www.hondori.or.jp/',hours:'Geschäfte ca. 10:00 bis 20:00',phone:'',cuisine:''}}];
const HIRO14=[{k:'senjokaku',ty:'S',n:'Senjokaku (Toyokuni-Schrein, Miyajima)',jp:'千畳閣',kw:'Halle der 1000 Tatami, Holzhalle, Hideyoshi, Pagode, Miyajima',t:'Größtes Holzgebäude auf Miyajima, die „Halle der 1000 Tatami-Matten“ (tatsächlich ca. 857). Sie wurde 1587 unter Toyotomi Hideyoshi begonnen und blieb unvollendet, ohne Decke und ohne Haupteingang. Offiziell ist sie der Toyokuni-Schrein. Man läuft ohne Schuhe über die alten Holzdielen und hat einen schönen Blick auf Itsukushima-Schrein und Bucht. Daneben steht die fünfstöckige Pagode. Eintritt Erwachsene 100 Yen. Geöffnet ca. 8:30 bis 16:30, täglich. Vom Fährhafen ca. 10 bis 15 Minuten zu Fuß, auf dem Hügel direkt neben dem Itsukushima-Schrein. Pin ungefähr, bitte auf der Karte prüfen.',ok:0,nw:1,dur:45,c:1,tr:{fuss:12},lat:34.2955,lon:132.3205,info:{addr:'Miyajimacho, Hatsukaichi, Hiroshima',web:'http://www.itsukushimajinja.jp/',hours:'8:30 bis 16:30',phone:'',cuisine:''}}];
const HIRO13=[{k:'misen',ty:'N',n:'Mount Misen (Miyajima)',jp:'弥山',kw:'Berg, Wanderung, Seilbahn, Aussicht, Miyajima',t:'Mit 535 m der höchste Berg von Miyajima, seit Jahrhunderten heilig. Aufstieg zu Fuß über einen der drei Wege dauert ca. 1,5 bis 2 Stunden (Daishō-in-Weg mit vielen Steinstufen). Bequemer mit der Miyajima-Seilbahn bis Shishiiwa, von dort noch ca. 30 Minuten steil zum Gipfel. Kombination Aufstieg zu Fuß und Seilbahn runter ist beliebt. Seilbahn ca. 9:00 bis 16:00 (letzte Talfahrt 16:30), hin und zurück ca. 1.800 bis 2.000 Yen (bitte aktuell prüfen). Aussichtsgebäude am Gipfel ca. 10:00 bis 16:00. Feste Schuhe und Wasser mitnehmen. Pin ungefähr, bitte auf der Karte prüfen.',ok:0,nw:1,dur:240,c:13,tr:{fuss:30},lat:34.2749,lon:132.3189,info:{addr:'Miyajimacho, Hatsukaichi, Hiroshima',web:'https://miyajima-ropeway.info/en/',hours:'Seilbahn 9:00 bis 16:00, Gipfel-Aussicht 10:00 bis 16:00',phone:'',cuisine:''}}];
const HIRO12=[{k:'shukkeien',ty:'N',n:'Shukkeien Garden',jp:'縮景園',kw:'Japanischer Garten, Teehaus, Teich, Ahornlaub, Pflaumenblüte',t:'Traditioneller Landschaftsgarten von 1620, angelegt für den Daimyō Asano Nagaakira. Der Name bedeutet „Garten der verkleinerten Landschaft“: Rund um den Teich Takuei zeigt ein Rundweg viele Miniatur-Landschaften mit Brücken, Inseln und Teehäusern. Besonders schön im Herbst (Laub) und im Winter zur Pflaumenblüte. Eintritt Erwachsene 260 Yen. Öffnungszeiten 9:00 bis 17:00, vom 16. März bis 15. September bis 18:00 (letzter Einlass 30 Minuten vorher), geschlossen 29. Dezember bis 1. Januar. Zu Fuß ca. 15 Minuten vom Bahnhof Hiroshima oder mit der Straßenbahn bis Shukkeien-mae. Zeit einplanen: ca. 1 bis 2 Stunden. Pin ungefähr, bitte auf der Karte prüfen.',ok:0,nw:1,dur:90,c:2,tr:{bahn:15,fuss:10},lat:34.4013,lon:132.4687,info:{addr:'2-11 Kaminoboricho, Naka-ku, Hiroshima',web:'https://shukkeien.jp/',hours:'9:00 bis 17:00 (16.3.–15.9. bis 18:00)',phone:'082-221-3620',cuisine:''}}];
const HIRO11=[{k:'orizuru tower',ty:'S',n:'Orizuru Tower',jp:'おりづるタワー',kw:'Aussichtsplattform, Atombombenkuppel, Papierkraniche, Hiroshima Hills',t:'Rund 50 m hohes Gebäude direkt neben dem Friedenspark und dem Atombombenkuppel-Dom. Auf dem Dach liegt die hölzerne Aussichtsplattform „Hiroshima Hills“ mit Blick auf Dom, Park und Stadt, bei klarem Wetter bis zum Berg Misen auf Miyajima. Im 12. Stock gibt es den Orizuru Square und die Orizuru Wall, wo man selbst gefaltete Papierkraniche einwerfen kann (100 Yen pro Kranich). Eintritt für Erwachsene ca. 2.200 Yen (rund 13 Euro, bitte aktuell prüfen). Geöffnet laut Angaben meist 10 bis 18 Uhr, Zeiten ändern sich je nach Saison. Anreise mit der Straßenbahn bis Genbaku-Dome-mae, direkt vor dem Eingang. Pin ungefähr, bitte auf der Karte prüfen.',ok:0,nw:1,dur:90,c:13,tr:{bahn:20},lat:34.3954,lon:132.4547,info:{addr:'1-2-1 Otemachi, Naka-ku, Hiroshima',web:'https://www.orizurutower.jp/en/',hours:'10:00 bis 18:00 (saisonal)',phone:'',cuisine:''}}];
const HIRO10=[{k:'light-up cruise',ty:'A',n:'Miyajima Light-up Cruise',jp:'宮島ライトアップクルーズ',kw:'Nachtfahrt, Torii, Boot, Abend',t:'Etwa 30 Minuten dauernde Abendfahrt mit dem Boot „Daisan Mikasamaru“ von Miyajima Pier 3 zum beleuchteten Großen Torii und zurück. Bei Flut ist das Torii besonders eindrucksvoll. Preis laut Anbieter Aqua Net ca. 1.600 Yen pro Erwachsenem (rund 9 Euro, bitte aktuell prüfen). Reservierung mindestens 2 Stunden vor Abfahrt nötig. Die Fahrten sind teils saisonal, bitte vorab prüfen, ob sie im Reisezeitraum (März) fahren. Die letzte fährt nach 17 Uhr, eine Rückfähre nach Miyajimaguchi geht abends noch länger. Pin ungefähr, bitte auf der Karte prüfen.',ok:0,nw:1,dur:60,c:9,tr:{bahn:30,fuss:10},lat:34.2985,lon:132.3198,info:{addr:'Miyajima Pier 3, Miyajimacho, Hatsukaichi, Hiroshima',web:'https://www.aqua-net-h.co.jp/en/sanpai/',hours:'',phone:'',cuisine:''}}];
const HIRO9=[{k:'marodo',ty:'S',n:'Marodo-Jinja Haiden (Itsukushima, Sessha)',jp:'客神社',kw:'Nebenschrein, Haiden, Itsukushima, Miyajima',t:'Marodo-Jinja ist ein Nebenschrein (Sessha) im Gelände des Itsukushima-Schreins auf Miyajima, mit eigener Haiden (Gebetshalle). Er liegt am Rundgang durch den Schreinkomplex, dessen Eintritt im Ticket des Itsukushima-Schreins enthalten ist. Gut mit dem Itsukushima-Schrein zu verbinden. Die Angaben sind aus meinem Wissen und nicht geprüft, bitte Details vor Ort prüfen. Pin ungefähr, bitte auf der Karte prüfen.',ok:0,nw:1,dur:20,tr:{fuss:15},lat:34.2961,lon:132.3198,info:{addr:'1-1 Miyajimacho, Hatsukaichi, Hiroshima (Itsukushima-Schrein)',web:'',hours:'',phone:'',cuisine:''}}];
const HIRO8=[{k:'henj',ty:'S',n:'Henjōkutsu-Höhle (Miyajima)',jp:'遍照窟',kw:'Höhle, Tempel, Buddha, Miyajima',t:'Dunkler unterirdischer Gang beim Daishō-in Tempel auf Miyajima mit Buddha-Figuren. Man läuft in der Höhle im Dunkeln und mit wenig Licht an den Figuren vorbei, eine ruhige, besondere Erfahrung. Gut mit dem Daishō-in zu verbinden. Bitte Öffnungszeiten und mögliche Preise vor Ort prüfen. Pin ungefähr, bitte auf der Karte prüfen.',ok:0,nw:1,dur:30,tr:{fuss:25},lat:34.2896,lon:132.3159,info:{addr:'Daishō-in, Miyajimacho, Hatsukaichi, Hiroshima',web:'',hours:'',phone:'',cuisine:''}}];
const HIRO6=[{k:'daisho',ty:'S',n:'Daishō-in Tempel (Miyajima)',jp:'大聖院',kw:'Tempel, Misen, Buddha, 500 Rakan, Miyajima',t:'Ältester und wichtigster Tempel der Insel Miyajima am Fuß des Berges Misen, mit Treppe mit Gebetsrädern, vielen Statuen und schöner Aussicht. Dazu gehört der Path of 500 Rakan: ein Weg mit hunderten kleinen Steinstatuen, die Schüler des Buddha darstellen und alle einen eigenen Gesichtsausdruck haben. Der Eingang liegt links vom Tempeltor, bevor man die Treppe hinaufsteigt. Hier beginnt eine der Wanderrouten auf den Misen. Der Zugang zum Tempel ist frei. Anreise ab Fähre Miyajima zu Fuß in ca. 20 Min. Pin ungefähr, bitte auf der Karte prüfen.',ok:0,nw:1,dur:105,free:1,tr:{fuss:20},lat:34.2893,lon:132.3156,info:{addr:'210 Miyajimacho, Hatsukaichi, Hiroshima',web:'',hours:'',phone:'',cuisine:''}}];
const HIRO5=[{k:'omotesando',ty:'M',n:'Miyajima Omotesandō Shopping Street',jp:'宮島表参道商店街',kw:'Einkaufsstraße, Momiji Manju, Austern, Souvenirs',t:'Lebhafte Einkaufsstraße von der Fähre Richtung Itsukushima-Schrein mit Läden und Imbissständen. Typisch sind Momiji Manju (Ahornblatt-Küchlein), gegrillte Austern, Aal und große Reiskellen als Souvenir. Gut zum Schlendern auf dem Weg zum Schrein, zahme Rehe laufen oft durch die Straße. Anreise ab Hiroshima mit der JR Sanyo-Linie nach Miyajimaguchi, dann Fähre (zusammen ca. 40 Min.) und kurzer Fußweg. Pin ungefähr, bitte auf der Karte prüfen.',ok:0,nw:1,dur:75,tr:{bahn:30,fuss:10},lat:34.2955,lon:132.3190,info:{addr:'Miyajimacho, Hatsukaichi, Hiroshima',web:'',hours:'',phone:'',cuisine:''}}];
const HIRO4=[{k:'miyajima (insel)',ty:'S',n:'Miyajima (Insel)',jp:'宮島',kw:'Insel, Rehe, Fähre, Mt. Misen, Momiji Manju',t:'Heilige Insel in der Bucht von Hiroshima, bekannt für das schwimmende Torii, zahme Rehe, die Einkaufsstraße Omotesando mit Austern und Momiji Manju sowie den Berg Misen mit Seilbahn. Anreise ab Hiroshima mit der JR Sanyo-Linie nach Miyajimaguchi (ca. 30 Min.) und mit der Fähre in ca. 10 Min. Ein halber Tag reicht für den Schrein und die Altstadt, mit Wanderung auf den Misen eher ein ganzer Tag. Pin ungefähr, bitte auf der Karte prüfen.',ok:0,nw:1,dur:300,tr:{bahn:30,fuss:15},lat:34.2965,lon:132.3185,info:{addr:'Miyajimacho, Hatsukaichi, Hiroshima',web:'',hours:'',phone:'',cuisine:''}}];
const HIRO3=[{k:'itsukushima',ty:'S',n:'Itsukushima-Schrein',jp:'厳島神社',kw:'Schrein, schwimmendes Torii, UNESCO, Miyajima',t:'UNESCO-Welterbe auf der Insel Miyajima mit dem berühmten roten Torii, das bei Flut im Wasser zu schweben scheint. Der Schrein steht auf Stelzen über dem Meer, bei Flut wirkt er wie schwebend. Anreise ab Hiroshima mit der JR Sanyo-Linie nach Miyajimaguchi (ca. 30 Min.), dann Fähre in ca. 10 Min. und 10 bis 15 Min. zu Fuß. Gezeiten vorher prüfen, bei Ebbe kann man zum Torii laufen. Für den Schrein wird ein kleiner Eintritt verlangt, dazu kommt die Inselgebühr der Fähre. Pin ungefähr, bitte auf der Karte prüfen.',ok:0,nw:1,dur:120,tr:{bahn:30,fuss:15},lat:34.2958,lon:132.3199,info:{addr:'1-1 Miyajimacho, Hatsukaichi, Hiroshima',web:'https://www.itsukushimajinja.jp',hours:'',phone:'',cuisine:''}},{k:'children',ty:'S',n:"Children's Peace Monument",jp:'原爆の子の像',kw:'Mahnmal, Papierkraniche, Sadako, Friedenspark',t:'Denkmal im Friedenspark für Sadako Sasaki und die Kinder, die durch die Atombombe starben. Davor hängen Papierkraniche, die Schulklassen aus aller Welt schicken. Der Besuch ist kurz und gut mit Friedenspark und Friedensmuseum zu verbinden. Frei zugänglich. Pin ungefähr, bitte auf der Karte prüfen.',ok:0,nw:1,dur:20,free:1,tr:{bahn:20,fuss:5},lat:34.3945,lon:132.4527,info:{addr:'Peace Memorial Park, Naka-ku, Hiroshima',web:'',hours:'',phone:'',cuisine:''}}];
const HIRO2=[{k:'okonomimura',ty:'R',n:'Okonomimura Hiroshima',jp:'お好み村',kw:'Okonomiyaki, Hiroshima-Style, Streetfood, Food-Court',t:'Mehrstöckiges Gebäude im Viertel Shintenchi mit rund 25 kleinen Okonomiyaki-Ständen, an denen man direkt an der Teppanplatte sitzt und dem Koch zusieht. Hiroshima-Style bedeutet geschichtet mit Nudeln statt gemischtem Teig. Jeder Stand hat seine eigene Art, Preise liegen meist um 1000 bis 1500 Yen. Anreise ab Hiroshima Hbf zu Fuß ca. 20 Min. oder mit der Straßenbahn bis Hatchobori. Pin ungefähr, bitte auf der Karte prüfen.',ok:0,dur:75,tr:{bahn:10,fuss:5},lat:34.3935,lon:132.4598,info:{addr:'5-13 Shintenchi, Naka-ku, Hiroshima',web:'',hours:'',phone:'',cuisine:'okonomiyaki'}},{k:'hiroshima castle',ty:'S',n:'Hiroshima Castle',jp:'広島城',kw:'Burg, Museum, Wassergraben, Aussicht',t:'Rekonstruierte Burg aus dem 16. Jahrhundert, auch Karpfenburg genannt, mit Wassergraben und Park. Im Burgturm gibt es ein kleines Museum zur Stadtgeschichte und oben eine Aussicht. Die Burg wurde 1945 zerstört und 1958 wieder aufgebaut. Anreise ab Hiroshima Hbf mit der Straßenbahn bis Kamiyacho-nishi oder zu Fuß in ca. 25 Min. Kombinierbar mit dem Friedenspark. Eintritt für den Turm bitte aktuell prüfen. Pin ungefähr, bitte auf der Karte kontrollieren.',ok:0,nw:1,dur:90,tr:{bahn:15,fuss:10},lat:34.4025,lon:132.4595,info:{addr:'21-1 Motomachi, Naka-ku, Hiroshima',web:'',hours:'',phone:'',cuisine:''}}];
const HIRO1=[{k:'peace memorial museum',ty:'S',n:'Hiroshima Peace Memorial Museum (Friedensmuseum)',jp:'広島平和記念資料館',kw:'Museum, Atombombe, Frieden, Geschichte',t:'Museum im Friedenspark, das die Atombombe vom 6. August 1945 und ihre Folgen mit Fotos, Gegenständen und Zeitzeugenberichten dokumentiert. Ein eindringlicher Besuch, plant dafür genug Zeit und etwas Ruhe danach ein. Anreise ab Hiroshima Hbf mit der Straßenbahn Richtung Miyajimaguchi bis Genbaku-Dome-mae in ca. 20 Min. Der Eintritt ist günstig, bitte aktuelle Preise und Öffnungszeiten prüfen. Pin ungefähr, bitte auf der Karte kontrollieren.',ok:0,nw:1,dur:120,tr:{bahn:20,fuss:5},lat:34.3916,lon:132.4535,info:{addr:'1-2 Nakajimacho, Naka-ku, Hiroshima',web:'https://hpmmuseum.jp',hours:'',phone:'',cuisine:''}},{k:'peace memorial park',ty:'S',n:'Hiroshima Peace Memorial Park (Friedenspark)',jp:'広島平和記念公園',kw:'Park, Atomic Dome, Mahnmal, Frieden',t:'Weitläufiger Gedenkpark im Zentrum von Hiroshima mit dem Atombombenkuppel-Dom (UNESCO-Welterbe), dem Kenotaph, der Flamme des Friedens und dem Kinderfriedensdenkmal mit den Papierkranichen. Der Park ist frei zugänglich und lässt sich gut mit dem Friedensmuseum verbinden. Anreise ab Hiroshima Hbf mit der Straßenbahn bis Genbaku-Dome-mae in ca. 20 Min. Pin ungefähr, bitte auf der Karte kontrollieren.',ok:0,nw:1,dur:90,free:1,tr:{bahn:20,fuss:5},lat:34.3955,lon:132.4536,info:{addr:'1 Nakajimacho, Naka-ku, Hiroshima',web:'',hours:'',phone:'',cuisine:''}}];

const FUK18=[{k:'kawachi',ty:'N',n:'Kawachi Wisteria Garden (Kitakyushu)',jp:'河内藤園',kw:'Glyzinien, Blumentunnel, Garten, Kitakyushu',t:'Privater Garten in den Hügeln von Kitakyushu mit berühmten Glyzinien-Tunneln, die zu den schönsten Japans zählen. Die Blüte ist ungefähr Ende April bis Anfang Mai, im März ist der Garten daher meist ohne Blüten. Der Eintritt ist nur in der Blütezeit kostenpflichtig, die Preise steigen je nach Blütenstand. Anreise ab Kokura oder Yahata mit Bus und Shuttle, ca. 1 Std. ab Hakata. In der Blütezeit gibt es oft Zeitfenster-Tickets. Die Pin-Position ist ungefähr, bitte auf der Karte prüfen.',ok:0,nw:1,dur:120,lat:33.8236,lon:130.7878,info:{addr:'Kawachi, Yahatahigashi-ku, Kitakyushu, Fukuoka',web:'',hours:'',phone:'',cuisine:''}}];

ition ist ungefähr.',ok:0,nw:1,dur:90,lat:33.2655,lon:131.3675,info:{addr:'Yufuin, Oita',web:'',hours:'',phone:'',cuisine:''}}];

/* Vergleich */
function statsFor(r){const old=S;try{if(r!==RG){let o=null;try{const t=LS.get(KEY(r),'')||LS.get('jp3-'+r,'');if(t){const j=JSON.parse(t);if(j&&j.stops)o=mig(j)}}catch(e){}S=o||mig(mk(r))}
 const v=S.stops,c=cats();let km=0,fl=0;for(let i=1;i<v.length;i++){const d=hav(v[i-1],v[i]),q=RTC[legKey(v[i-1],v[i])];if(d>500)fl++;km+=q&&d<=500?q.d/1000:(d>500?d:d*1.3)}
 let ok=0,wn=0;v.forEach((s,i)=>{const b=bl(i);if(b){wn++;if(b.k==='ok')ok++}});const tc=k=>v.filter(s=>(s.tg||'').includes(k)).length;
 return{r,t:S.title,n:v.length,d:days(),cost:grand(),km,fl,ok,wn,tags:{N:tc('N'),E:tc('E'),K:tc('K'),S:tc('S'),B:tc('B'),R:tc('R')},names:v.map(s=>s.n.split(' &')[0]).join(' → ')}}finally{S=old}}
function vCmp(){const rs=Object.keys(PRE).map(statsFor),best=(f,mx)=>{const vals=rs.map(f),m=mx?Math.max(...vals):Math.min(...vals);return x=>f(x)===m};const bc=best(x=>x.cost,0),bk=best(x=>x.km,0),bb=best(x=>x.ok,1);
 const row=(l,f,cls)=>'<tr><th>'+l+'</th>'+rs.map(x=>'<td class="'+(cls&&cls(x)?'best':'')+'">'+f(x)+'</td>').join('')+'</tr>';
 let h='<button class="back" data-a="cmp-back">‹ Zurück</button><h2>⚖️ Varianten im Vergleich</h2><div style="overflow-x:auto"><table class="cmp"><tr><th></th>'+rs.map(x=>'<th'+(x.r===RG?' class="cur"':'')+'>'+SHORT[x.r]+'</th>').join('')+'</tr>'+
 row('Route',x=>'<span class="sm">'+esc(x.names)+'</span>')+row('Tage',x=>x.d)+row('Kosten für zwei',x=>eur(x.cost),bc)+row('pro Person',x=>eur(x.cost/2),bc)+row('Strecke',x=>'ca. '+Math.round(x.km).toLocaleString('de-AT')+' km',bk)+row('Flüge im Land',x=>x.fl)+row('Blüte passt',x=>x.ok+' von '+x.wn,bb)+
 row('🌿 Natur',x=>x.tags.N)+row('🍜 Essen',x=>x.tags.E)+row('🛕 Kultur',x=>x.tags.K)+row('🏙️ Stadt',x=>x.tags.S)+row('🏖️ Strand',x=>x.tags.B)+row('😌 Entspannung',x=>x.tags.R)+
 '<tr><th></th>'+rs.map(x=>'<td>'+(x.r===RG?'<span class="badge ok">aktiv</span>':'<button class="btn sm2" data-a="cmp-open" data-r="'+x.r+'">Öffnen</button>')+'</td>').join('')+'</tr></table></div><p class="mut sm">Grün: bester Wert in der Zeile (günstigste Kosten, kürzeste Strecke, meiste Blüte-Treffer). Eure Änderungen sind eingerechnet. Alle Zahlen sind Schätzungen.</p>';return h}
/* Gemeinsam planen (jsonblob.com) */
const JB='https://jsonblob.com/api/jsonBlob',JH={'Content-Type':'application/json','Accept':'application/json'};
const SYK=()=>'jp4-sync-'+RG;
function syLoad(){try{SY=JSON.parse(LS.get(SYK(),'null'))}catch(e){SY=null}}

function syStrip(){const o=JSON.parse(JSON.stringify(S));o.stops.forEach(s=>{s.imgs=[];delete s.ph;s.pl.forEach(x=>{x.imgs=[];delete x.ph;delete x.info})});return o}
function syMerge(rem){const loc={};S.stops.forEach(s=>{loc[s.id]=s});rem.stops.forEach(s=>{const l=loc[s.id];if(l){s.imgs=l.imgs||[];s.ph=l.ph;s.phTried=l.phTried;const near=(a,b)=>a.lat&&b.lat&&Math.abs(a.lat-b.lat)<2e-4&&Math.abs(a.lon-b.lon)<2e-4;const used=new Set();s.pl.forEach(x=>{const m=(l.pl||[]).find(y=>y.n===x.n)||(l.pl||[]).find(y=>near(x,y));if(m){used.add(m);x.imgs=m.imgs||[];if(m.pid)x.pid=m.pid;x.ph=m.ph;x.phTried=m.phTried;x.info=m.info}});(l.pl||[]).forEach(y=>{if(!used.has(y)&&y.imgs&&y.imgs.length)s.pl.push(y)})}});return rem}
const syLink=()=>location.origin+location.pathname+'#j='+SY.id+'~'+RG;
async function syCreate(){try{const r=await fetch(JB,{method:'POST',headers:JH,body:JSON.stringify({rg:RG,ts:S.ts||Date.now(),s:syStrip()})});if(!r.ok)throw new Error('HTTP '+r.status);const loc=r.headers.get('Location')||r.headers.get('X-jsonblob');if(!loc)throw new Error('Der Dienst hat keine Adresse zurückgegeben (Browser-Sperre).');SY={id:String(loc).split('/').pop(),rts:S.ts||0,last:Date.now(),auto:true};sySave();DIRTY=false;copy(syLink(),'Gemeinsamer Plan erstellt. Link kopiert: in WhatsApp senden.');renderPanel()}catch(e){toast('Gemeinsamer Plan konnte nicht erstellt werden: '+e.message)}}
async function syPush(silent){if(!SY)return;try{const ts=S.ts||Date.now();const r=await fetch(JB+'/'+SY.id,{method:'PUT',headers:JH,body:JSON.stringify({rg:RG,ts,s:syStrip()})});if(!r.ok)throw new Error('HTTP '+r.status);SY.rts=ts;SY.last=Date.now();sySave();DIRTY=false;if(!silent)toast('Hochgeladen.');if(view==='more')renderPanel()}catch(e){if(!silent)toast('Hochladen fehlgeschlagen: '+e.message)}}
function syApply(rem){inPull=true;try{S=mig(syMerge(rem.s));S.ts=rem.ts;LS.set(KEY(RG),lsStr());phPersist();SY.rts=rem.ts;SY.last=Date.now();sySave();DIRTY=false;curDay=null;sel=-1;openS=false;render()}finally{inPull=false}}
async function syPull(silent){if(!SY)return;try{const r=await fetch(JB+'/'+SY.id,{headers:{'Accept':'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);const rem=await r.json();if(!rem||!rem.s||!rem.s.stops)throw new Error('Unerwartete Antwort');
 if(rem.ts>(SY.rts||0)){if(!DIRTY){syApply(rem);if(!silent||true)toast('Neuer Stand von deiner Reisepartnerin geladen.')}else if(confirm('Ihr habt beide geändert.\n\nOK = meinen Stand behalten und hochladen\nAbbrechen = den neuen Stand laden (meine letzten Änderungen gehen verloren)'))syPush();else syApply(rem)}else if(!silent)toast('Schon auf dem neuesten Stand.')}catch(e){if(!silent)toast('Abholen fehlgeschlagen: '+e.message)}}

async function syJoin(id,rg){try{const r=await fetch(JB+'/'+id,{headers:{'Accept':'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);const rem=await r.json();if(!rem||!rem.s||!rem.s.stops)throw new Error('Unerwartete Antwort');RG=PRE[rem.rg||rg]?(rem.rg||rg):RG;LS.set('jp4-rg',RG);S=mig(rem.s);S.ts=rem.ts;inPull=true;LS.set(KEY(RG),lsStr());inPull=false;SY={id,rts:rem.ts,last:Date.now(),auto:true};sySave();DIRTY=false;curDay=null;sel=-1;openS=false;view='home';render();fitAll();toast('Gemeinsamer Plan geladen. Änderungen werden automatisch geteilt.')}catch(e){toast('Gemeinsamer Plan konnte nicht geladen werden: '+e.message)}}
